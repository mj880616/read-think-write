name: Test and Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate deployment asset version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ["GITHUB_SHA"][:12]
          index = Path("index.html")
          text = index.read_text()

          styles_source = Path("src/styles.css")
          styles_name = f"styles.{version}.css"
          styles_target = Path("src") / styles_name
          styles_target.write_bytes(styles_source.read_bytes())
          text = text.replace("./src/styles.css", f"./src/{styles_name}")

          entry_source = Path("src/app-entry.js")
          entry_text = entry_source.read_text()
          local_modules = [
              "auth-oauth.js",
              "main.js",
              "auth-enhance.js",
              "reading-entry-flow.js",
              "reading-import-ui.js",
              "reading-ai-ui.js",
          ]
          for module in local_modules:
              source = Path("src") / module
              target_name = f"{source.stem}.{version}{source.suffix}"
              target = Path("src") / target_name
              target.write_bytes(source.read_bytes())
              entry_text = entry_text.replace(f"./{module}", f"./{target_name}")

          entry_name = f"app-entry.{version}.js"
          (Path("src") / entry_name).write_text(entry_text)
          text = text.replace("./src/app-entry.js", f"./src/{entry_name}")
          index.write_text(text)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
