name: Deploy RTW Worker custom domains

on:
  workflow_dispatch:
    inputs:
      confirm_read_cutover:
        description: 'Type read.bokdoong.com to authorize the production domain transfer'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rtw-worker-custom-domains
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_read_cutover == 'read.bokdoong.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check cloudflare/rtw-router.mjs
      - name: Deploy read-test.bokdoong.com and transfer read.bokdoong.com
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.RTW_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.RTW_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: deploy --config cloudflare/wrangler.toml
      - name: Verify both domains and live assets
        run: node cloudflare/verify-deployment.mjs
