  "paths": {
    "/rtw-personal-write": {
      "post": {
        "operationId": "addPersonalItem",
        "summary": "읽생기에 개인 항목 추가",
        "description": "항목 하나를 추가합니다. action=resource는 title이 필수이며 글 본문은 반드시 body_md로 보냅니다(body 사용 금지). action=note 또는 question은 body가 필수입니다. 종류별 스키마에 없는 필드는 거절합니다. note의 resource_id는 소유권 확인 후 저장하며 question에는 허용하지 않습니다.",
        "x-openai-isConsequential": true,
        "security": [
          {
            "PersonalWriteKey": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "action"
                ],
                "properties": {
                  "action": {
                    "type": "string",
                    "enum": [
                      "resource",
                      "note",
                      "question"
                    ],
                    "description": "action: 추가할 종류. resource=읽기 글(body_md), note=메모(body), question=질문(body)."
                  },
                  "title": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 500,
                    "pattern": "\\S",
                    "description": "title: resource 전용 필수 글 제목. 1~500자이며 공백만 있는 제목은 거절합니다."
                  },
                  "original_title": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 500,
                    "description": "original_title: resource 전용 원문 제목(최대 500자). 모르면 생략/null."
                  },
                  "author": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 300,
                    "description": "author: resource 전용 저자(최대 300자). 모르면 생략/null."
                  },
                  "source_name": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 300,
                    "description": "source_name: resource 전용 발행처(최대 300자). 모르면 생략/null."
                  },
                  "published_on": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "minLength": 10,
                    "maxLength": 10,
                    "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                    "format": "date",
                    "description": "published_on: resource 전용 원문 발표일. 유효한 YYYY-MM-DD(10자)만 허용합니다. 모르면 생략/null. 저장 시각과 다릅니다."
                  },
                  "original_url": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "minLength": 1,
                    "maxLength": 2048,
                    "pattern": "^[hH][tT][tT][pP][sS]?://",
                    "format": "uri",
                    "description": "original_url: resource 전용 원문 URL. 유효한 http/https 주소(최대 2048자). 모르면 생략/null."
                  },
                  "body_md": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 60000,
                    "description": "body_md: action=resource의 글 본문 필드명입니다. 반드시 body_md로 전달하며 body는 허용하지 않습니다. Markdown 또는 일반 텍스트, 최대 60000자. 따옴표와 줄바꿈 허용. 생략/null이면 빈 본문. 서버는 URL에서 본문을 가져오지 않습니다."
                  },
                  "body": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 60000,
                    "pattern": "\\S",
                    "description": "body: action=note 또는 question의 필수 내용(1~60000자). 공백만 있는 내용은 거절합니다. resource에는 사용 금지이며 글 본문은 body_md로 보냅니다."
                  },
                  "note_type": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 30,
                    "description": "note_type: note 전용 분류(최대 30자). 기존 DB 제약에 맞춰 양끝 공백 없이 사용합니다. 생략/null/빈 문자열이면 생각으로 저장합니다. 고정 허용값 목록은 없습니다."
                  },
                  "resource_id": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "minLength": 36,
                    "maxLength": 36,
                    "format": "uuid",
                    "description": "resource_id: note 전용 참조 글 UUID(36자). 고정 소유자의 글인지 확인하며 외부 소유/미존재는 같은 오류로 거절합니다. resource/question에는 null이어도 허용하지 않습니다."
                  },
                  "current_thought": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 60000,
                    "description": "current_thought: question 전용 현재 생각(최대 60000자). 생략/null 허용."
                  }
                },
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/resource"
                  },
                  {
                    "$ref": "#/components/schemas/note"
                  },
                  {
                    "$ref": "#/components/schemas/question"
                  }
                ],
                "description": "action에 맞는 oneOf 스키마 하나만 사용합니다. resource: action/title 필수, 본문은 body_md. note/question: action/body 필수. 다른 종류의 필드나 임의 필드를 섞지 않습니다."
