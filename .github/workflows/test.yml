name: Read Think Write tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Install Chromium for body rendering regression checks
        run: npx playwright install --with-deps chromium
      - name: Check Markdown and Mermaid in Chromium
        run: npm run test:markdown:browser && npm run test:mermaid:browser
