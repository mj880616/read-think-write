<!doctype html><html><head><meta charset="utf-8"><script>
(function(){
  var repoBase='/read-think-write/';
  var isProjectSite=location.hostname.endsWith('.github.io')&&location.pathname.startsWith(repoBase);
  var base=isProjectSite?repoBase:'/';
  var rel=isProjectSite?location.pathname.slice(repoBase.length-1):location.pathname;
  location.replace(base+'?redirect='+encodeURIComponent(rel+location.search+location.hash));
})();
</script></head><body></body></html>
