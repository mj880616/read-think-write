          "400": {
            "description": "입력 오류는 field/reason으로 원인을 알립니다. field는 명세 필드명 또는 $request(요청 전체/임의 필드), reason은 고정 코드입니다. 입력값과 내부 정보는 반환하지 않습니다. 참조 존재 여부는 구분하지 않습니다.",
            "content": {
