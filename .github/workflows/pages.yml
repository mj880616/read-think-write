name: Test and Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate deployment asset version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ["GITHUB_SHA"][:12]
          index = Path("index.html")
          text = index.read_text()

          styles_source = Path("src/styles.css")
          styles_name = f"styles.{version}.css"
          styles_target = Path("src") / styles_name
          styles_target.write_bytes(styles_source.read_bytes())
          text = text.replace("./src/styles.css", f"./src/{styles_name}")

          js_sources = list(Path("src").glob("*.js"))
          js_names = {source.name: f"{source.stem}.{version}{source.suffix}" for source in js_sources}
          for source in js_sources:
              module_text = source.read_text()
              for original, fingerprinted in js_names.items():
                  module_text = module_text.replace(f"./{original}", f"./{fingerprinted}")
              (Path("src") / js_names[source.name]).write_text(module_text)

          text = text.replace("./src/app-entry.js", f"./src/{js_names['app-entry.js']}")
          index.write_text(text)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
