              "example": {
                "action": "resource",
                "title": "예시 글 제목",
                "author": "예시 저자",
                "published_on": "2026-10-04",
                "body_md": "첫 문단에 “인용문”을 포함합니다.\n\n둘째 문단입니다."
              }
            }
          }
